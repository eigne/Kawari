name: Main

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # There's no point in building release binaries for PRs, they are slower to build and no one is going to download them
  CARGO_PROFILE: ${{ github.ref == 'refs/heads/master' && '--release' || '' }}
  PROFILE_NAME: ${{ github.ref == 'refs/heads/master' && 'release' || 'debug' }}

jobs:
  build-webassembly:
    name: "Build (WebAssembly)"
    runs-on: docker
    # Skip running on PR events that come from the same repository, it will just duplicate the branch action
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
    - uses: actions/checkout@v6
    - name: Setup Rust
      uses: https://github.com/dtolnay/rust-toolchain@stable
      with:
        targets: "wasm32-unknown-unknown"
    - uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: wasm-${{ env.PROFILE_NAME }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --package kawari ${{ env.CARGO_PROFILE }} --target=wasm32-unknown-unknown --lib --no-default-features

  build:
    name: "Build (${{ matrix.os_name }} ${{ matrix.target_name }})"
    runs-on: docker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    strategy:
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          target_name: x86_64
          os_name: linux
        - target: aarch64-unknown-linux-gnu
          target_name: aarch64
          os_name: linux
        - target: x86_64-pc-windows-gnu
          target_name: x86_64
          os_name: windows

    steps:
    - uses: actions/checkout@v6
    - name: Setup Rust
      uses: https://github.com/dtolnay/rust-toolchain@stable
      with:
        components: "clippy rustfmt"
        targets: "${{ matrix.target }}"
    - uses: actions/cache@v5
      id: cache-mdbook
      with:
        path: |
          ~/.cargo/bin/mdbook
        key: mdbook
    - if: steps.cache-mdbook.outputs.cache-hit != 'true'
      run: |
        cargo install --git https://github.com/rust-lang/mdBook.git mdbook
    - uses: actions/cache@v5
      id: cache-deps
      with:
        path: |
          ~/.cargo/bin/
          !~/.cargo/bin/mdbook
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ matrix.os_name }}-${{ matrix.target_name }}-${{ env.PROFILE_NAME }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cmake libclang-dev rsync
    - name: Setup Target (Linux x86_64)
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        wget https://github.com/WorkingRobot/OodleUE/releases/download/2026-06-04-1357/clang-x64-release.zip
        unzip clang-x64-release.zip
        mkdir oodle
        cp lib/liboodle-network-shared.so oodle/
    - name: Setup Target (Linux aarch64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        wget https://github.com/WorkingRobot/OodleUE/releases/download/2026-06-04-1357/clang-arm64-release.zip
        unzip clang-arm64-release.zip
        mkdir oodle
        cp lib/liboodle-network-shared.so oodle/
        sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
    - name: Setup Target (Windows x86_64)
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
    - name: Build
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      run: cargo build ${{ env.CARGO_PROFILE }} --target ${{ matrix.target }} --features oodle
    - name: Run Clippy
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo clippy --features oodle -- -Dwarnings --target ${{ matrix.target }}
    - name: Run Cargo fmt
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo fmt --check
    - name: Run tests
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo test ${{ env.CARGO_PROFILE }} --target ${{ matrix.target }} --features oodle
      env:
        CI: 1
    - name: Build documentation
      run: |
        mdbook build --dest-dir=docs-build ./docs
        mv docs docs-1
        mv docs-build docs
    - name: Prepare artifacts
      run: |
        mv target/${{ matrix.target }}/${{ env.PROFILE_NAME }}/* .
        echo "${{ github.sha }}" >> version.txt
    - name: Archive artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kawari-${{ matrix.os_name }}-${{ matrix.target_name }}
        path: |
          LICENSE
          README.md
          kawari-admin*
          kawari-frontier*
          kawari-lobby*
          kawari-login*
          kawari-patch*
          kawari-web*
          kawari-world*
          kawari-navimesh*
          kawari-run*
          !*.d
          resources/
          !resources/data/
          version.txt
          docs/
          !docs/src/
          !docs/book.toml

    - name: Set up SSH key
      if: matrix.target == 'x86_64-unknown-linux-gnu' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        printf "Host ryne.moe\nPort 38901\nStrictHostKeyChecking no" >> ~/.ssh/config
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/config

    - name: Upload API documentation
      if: matrix.target == 'x86_64-unknown-linux-gnu' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      run: |
        cargo doc ${{ env.CARGO_PROFILE }} --no-deps --lib
        rsync -e "ssh -p 38901 -o StrictHostKeyChecking=no" --recursive target/doc/ deploy@ryne.moe:/srv/http/kawari-api-docs

  deploy:
    name: "Deploy"
    runs-on: docker
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends rsync
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        printf "Host ryne.moe\nPort 38901\nStrictHostKeyChecking no" >> ~/.ssh/config
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/config
    - name: Upload artifacts
      run: |
        pushd kawari-linux-x86_64
        chmod +x ./kawari-*
        zip -r ../kawari-linux-x86_64.zip *
        popd

        pushd kawari-linux-aarch64
        chmod +x ./kawari-*
        zip -r ../kawari-linux-aarch64.zip *
        popd

        pushd kawari-windows-x86_64
        zip -r ../kawari-windows-x86_64.zip *
        popd

        rsync --recursive "kawari-linux-x86_64.zip" deploy@ryne.moe:/srv/http/astra-distrib/kawari/
        rsync --recursive "kawari-linux-aarch64.zip" deploy@ryne.moe:/srv/http/astra-distrib/kawari/
        rsync --recursive "kawari-windows-x86_64.zip" deploy@ryne.moe:/srv/http/astra-distrib/kawari/
        unzip "kawari-linux-x86_64.zip"
        rsync --recursive --delete docs/ deploy@ryne.moe:/srv/http/kawari-docs

